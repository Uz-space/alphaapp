kind = "mobile"
previewPath = "/"
title = "Crypto Watcher X Exchange"
version = "1.0.0"
id = "artifacts/crypto-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22824

[services.development]
run = "pnpm --filter @workspace/crypto-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crypto-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/crypto-app", "run", "serve" ]

[services.env]
PORT = "22824"
BASE_PATH = "/"
