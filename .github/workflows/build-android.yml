name: Build Android APK & AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (preview)
        working-directory: artifacts/crypto-app
        run: eas build --platform android --profile preview --non-interactive --output ./build/app.apk

      - name: Build Android AAB (production)
        working-directory: artifacts/crypto-app
        run: eas build --platform android --profile production --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-app-apk
          path: artifacts/crypto-app/build/app.apk
          if-no-files-found: warn
